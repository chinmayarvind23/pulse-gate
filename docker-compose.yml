services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:16380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  gateway:
    image: pulsegate/gateway:local
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      PULSEGATE_REDIS_ADDR: redis:6379
      PULSEGATE_HMAC_SECRET: ${PULSEGATE_HMAC_SECRET:?Set PULSEGATE_HMAC_SECRET in .env}
      PULSEGATE_MAX_QUEUE: ${PULSEGATE_MAX_QUEUE:-1000000}
    depends_on:
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
  risk-worker:
    image: pulsegate/risk-worker:local
    build:
      context: .
      dockerfile: apps/risk-worker/Dockerfile
    environment:
      PULSEGATE_REDIS_ADDR: redis:6379
      PULSEGATE_WORKER_BATCH: 256
      RUST_LOG: info
    depends_on:
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8081:8081"]
    restart: unless-stopped
  prometheus:
    image: mirror.gcr.io/prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [gateway, risk-worker]
  grafana:
    image: mirror.gcr.io/grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-disabled-login}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
volumes:
  redis-data:
