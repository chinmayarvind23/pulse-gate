services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
    ports: ["8080:8080"]
  risk-worker:
    build:
      context: .
      dockerfile: apps/risk-worker/Dockerfile
    env_file: .env
    depends_on:
      redis: {condition: service_healthy}
    ports: ["8081:8081"]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]
