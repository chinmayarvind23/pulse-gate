apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: hookguard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hookguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 1536mb, --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          startupProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hookguard
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
