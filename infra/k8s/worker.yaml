apiVersion: apps/v1
kind: Deployment
metadata: {name: risk-worker, namespace: hookguard}
spec:
  replicas: 2
  selector: {matchLabels: {app: risk-worker}}
  template:
    metadata: {labels: {app: risk-worker}}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: risk-worker
          image: hookguard/risk-worker:local
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{containerPort: 8081}]
          env:
            - {name: HOOKGUARD_REDIS_ADDR, value: "redis:6379"}
            - {name: HOOKGUARD_WORKER_CONSUMER, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          startupProbe: {httpGet: {path: /healthz, port: 8081}, periodSeconds: 2, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, initialDelaySeconds: 1, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 3, periodSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {cpu: "2", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: risk-worker, namespace: hookguard}
spec:
  selector: {app: risk-worker}
  ports: [{port: 8081, targetPort: 8081}]
