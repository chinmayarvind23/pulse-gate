apiVersion: apps/v1
kind: Deployment
metadata: {name: risk-worker, namespace: pulsegate}
spec:
  replicas: 2
  selector: {matchLabels: {app: risk-worker}}
  template:
    metadata: {labels: {app: risk-worker}}
    spec:
      containers:
        - name: risk-worker
          image: pulsegate/risk-worker:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8081}]
          env:
            - {name: PULSEGATE_REDIS_ADDR, value: "redis:6379"}
            - {name: PULSEGATE_WORKER_CONSUMER, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
          readinessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 1, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 3, periodSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 64Mi}
            limits: {cpu: "2", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: risk-worker, namespace: pulsegate}
spec:
  selector: {app: risk-worker}
  ports: [{port: 8081, targetPort: 8081}]
